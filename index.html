<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Radio Dial</title>

<!-- PWA / Add to Home Screen -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0B1220" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Radio Dial" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #0B1220;
    --panel: #141d30;
    --panel-2: #1b2740;
    --amber: #E8A33D;
    --rust: #B23A2E;
    --cream: #F2ECD9;
    --slate: #5b6b85;
    --line: rgba(232,163,61,0.18);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 50% -10%, rgba(232,163,61,0.10), transparent 60%),
      radial-gradient(ellipse at 50% 110%, rgba(178,58,46,0.08), transparent 60%);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  .app {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(28px, env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
  }

  /* speaker grille */
  .grille {
    display: grid;
    grid-template-columns: repeat(14, 1fr);
    gap: 5px;
    width: 100%;
    max-width: 260px;
    margin-bottom: 22px;
    opacity: 0.55;
  }
  .grille span {
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--panel-2);
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 15px;
    color: var(--slate);
    margin: 0 0 4px;
  }

  .subtitle {
    font-size: 12px;
    color: var(--slate);
    margin-bottom: 26px;
    letter-spacing: 0.02em;
  }

  /* display strip: on-air status */
  .display {
    width: 100%;
    background: #060a13;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  .display::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
  }
  .display-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .station-name {
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--cream);
    transition: color 0.3s;
  }
  .status-dot {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--slate);
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
  }
  .status-dot .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--slate);
    transition: all 0.3s;
  }
  .status-dot.live .dot {
    background: var(--rust);
    box-shadow: 0 0 8px 2px rgba(178,58,46,0.6);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .status-dot.live { color: var(--rust); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* equalizer */
  .eq {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 22px;
    margin-top: 12px;
  }
  .eq span {
    width: 4px;
    background: var(--amber);
    border-radius: 2px;
    height: 4px;
    opacity: 0.35;
    transition: opacity 0.3s;
  }
  .eq.live span {
    opacity: 1;
    animation: bounce 0.9s ease-in-out infinite;
  }
  .eq span:nth-child(1){ animation-delay: 0s; }
  .eq span:nth-child(2){ animation-delay: 0.15s; }
  .eq span:nth-child(3){ animation-delay: 0.3s; }
  .eq span:nth-child(4){ animation-delay: 0.1s; }
  .eq span:nth-child(5){ animation-delay: 0.25s; }
  @keyframes bounce {
    0%, 100% { height: 4px; }
    50% { height: 20px; }
  }

  /* station buttons */
  .stations {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .station-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    padding: 16px 18px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    color: var(--cream);
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.25s, box-shadow 0.25s;
    text-align: left;
  }
  .station-btn:active { transform: scale(0.98); }

  .station-btn.playing {
    border-color: var(--amber);
    box-shadow: 0 0 0 1px rgba(232,163,61,0.3), 0 8px 24px -8px rgba(232,163,61,0.35);
  }

  .freq {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--amber);
    min-width: 74px;
    line-height: 1;
  }
  .freq small {
    display: block;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--slate);
    margin-top: 2px;
  }

  .meta { flex: 1; min-width: 0; }
  .meta .name {
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    font-weight: 500;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta .desc {
    font-size: 12px;
    color: var(--slate);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .play-icon {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(232,163,61,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .station-btn.playing .play-icon {
    background: var(--rust);
  }
  .play-icon svg { width: 16px; height: 16px; fill: var(--amber); }
  .station-btn.playing .play-icon svg { fill: var(--cream); }

  .hint {
    margin-top: 30px;
    font-size: 11px;
    color: var(--slate);
    text-align: center;
    line-height: 1.6;
    max-width: 320px;
  }

  .buffering {
    font-style: normal;
  }
</style>
</head>
<body>
<div class="app">

  <div class="grille" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <h1>Radio Dial</h1>
  <div class="subtitle">Sintonía en vivo &middot; toca para escuchar</div>

  <div class="display">
    <div class="display-row">
      <div>
        <div class="station-name" id="stationName">Selecciona una emisora</div>
        <div class="eq" id="eq">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="status-dot" id="statusDot"><span class="dot"></span><span id="statusText">Off Air</span></div>
    </div>
  </div>

  <div class="stations" id="stations"></div>

  <div class="hint">Si el audio no comienza al primer toque, vuelve a presionar el botón: los navegadores móviles requieren una interacción directa para reproducir sonido.</div>
</div>

<audio id="player" preload="none"></audio>

<script>
  // ---- Configura aquí tus tres emisoras ----
  const STATIONS = [
    {
      freq: '102.3',
      name: 'Aspen',
      desc: 'Pura Música las 24 hs · Aspen',
      url: 'http://playerservices.streamtheworld.com/api/livestream-redirect/ASPENAAC.aac'
    },
    {
      freq: '99.1',
      name: 'Drone Zone',
      desc: 'Ambient espacial · SomaFM',
      url: 'https://ice1.somafm.com/dronezone-256-mp3'
    },
    {
      freq: '104.7',
      name: 'Deep Space One',
      desc: 'Electrónica atmosférica · SomaFM',
      url: 'https://ice1.somafm.com/deepspaceone-128-mp3'
    }
  ];

  const player = document.getElementById('player');
  const stationsEl = document.getElementById('stations');
  const stationNameEl = document.getElementById('stationName');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const eq = document.getElementById('eq');

  let currentIndex = null;
  let buttons = [];

  function playIconSvg() {
    return '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  }
  function stopIconSvg() {
    return '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>';
  }

  STATIONS.forEach((st, i) => {
    const btn = document.createElement('button');
    btn.className = 'station-btn';
    btn.innerHTML = `
      <div class="freq">${st.freq}<small>FM</small></div>
      <div class="meta">
        <div class="name">${st.name}</div>
        <div class="desc">${st.desc}</div>
      </div>
      <div class="play-icon">${playIconSvg()}</div>
    `;
    btn.addEventListener('click', () => toggleStation(i));
    stationsEl.appendChild(btn);
    buttons.push(btn);
  });

  function setStatus(state) {
    // state: 'off' | 'buffering' | 'live'
    statusDot.classList.remove('live');
    eq.classList.remove('live');
    if (state === 'off') {
      statusText.textContent = 'Off Air';
    } else if (state === 'buffering') {
      statusText.textContent = 'Conectando…';
    } else if (state === 'live') {
      statusDot.classList.add('live');
      eq.classList.add('live');
      statusText.textContent = 'On Air';
    }
  }

  function updateButtons() {
    buttons.forEach((b, i) => {
      const playing = i === currentIndex;
      b.classList.toggle('playing', playing);
      b.querySelector('.play-icon').innerHTML = playing ? stopIconSvg() : playIconSvg();
    });
  }

  function toggleStation(i) {
    if (currentIndex === i) {
      // stop
      player.pause();
      player.src = '';
      currentIndex = null;
      stationNameEl.textContent = 'Selecciona una emisora';
      setStatus('off');
      updateButtons();
      return;
    }

    currentIndex = i;
    const st = STATIONS[i];
    stationNameEl.textContent = st.name;
    setStatus('buffering');
    updateButtons();

    player.src = st.url;
    player.load();
    const playPromise = player.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        setStatus('off');
        stationNameEl.textContent = 'No se pudo reproducir — intenta de nuevo';
      });
    }
  }

  player.addEventListener('playing', () => setStatus('live'));
  player.addEventListener('waiting', () => setStatus('buffering'));
  player.addEventListener('pause', () => { if (currentIndex !== null) setStatus('buffering'); });
  player.addEventListener('error', () => {
    setStatus('off');
    stationNameEl.textContent = 'Error de conexión — intenta de nuevo';
    currentIndex = null;
    updateButtons();
  });

  // Register service worker for basic offline app-shell / installability
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
